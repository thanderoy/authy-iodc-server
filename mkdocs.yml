site_name: Authy OIDC Server
site_description: Documentation for Authy OIDC Server

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
