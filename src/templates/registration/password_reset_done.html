{% extends "base.html" %}

{% block title %}Reset Email Sent - Authy{% endblock %}

{% block content %}
<div class="auth-header">
    <h1>Check Your Email</h1>
    <p>If an account exists with that email, a password reset link has been dispatched.</p>
</div>

<div class="alert alert-success m-bottom-2">
    Please check your inbox and spam folders for the next steps.
</div>

<a href="{% url 'login' %}" class="btn btn-secondary">
    Return to Login
</a>
{% endblock %}
